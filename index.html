/* ==========================================================
   KOTOBA design tokens - change colors/fonts here only.
   Red comes from the supplied icon (#F40409 -> #A30206)
   and wordmark (#D01216).
   ========================================================== */
:root {
  --red: #d01216;
  --red-hover: #a30206;
  --red-tint: #fdecec;
  --ink: #141414;
  --ink-2: #4a4a4a;
  --ink-3: #6b6b6b;
  --line: #e6e6e6;
  --surface: #ffffff;
  --surface-2: #f6f6f6;

  /* Wordmark is a rounded bubble face. Fredoka is the closest free match.
     To use it: download it from Google Fonts, put the file in assets/ and add
     an @font-face rule. Until then the fallbacks below are used. */
  --font-display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;

  --avatar-radius: 32%; /* echoes the soft corners of the K icon */
  --ease: 160ms ease;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.5 var(--font-body); color: var(--ink); background: var(--surface); overflow-x: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, textarea { font: inherit; color: inherit; }
h1, h2, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip-link:focus { left: 8px; }

.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 1px solid transparent; border-radius: 999px; font-weight: 600; cursor: pointer; transition: background var(--ease), border-color var(--ease), opacity var(--ease); }
.btn--primary { background: var(--red); color: #fff; }
.btn--primary:hover { background: var(--red-hover); }
.btn--outline { background: var(--surface); border-color: var(--ink); }
.btn--outline:hover { background: var(--surface-2); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.btn[disabled]:hover { background: var(--red); }
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
.sidebar, .aside { display: none; }
.main { min-width: 0; outline: none; }

.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; height: 56px; padding: 0 16px; padding-top: env(safe-area-inset-top); background: var(--surface); border-bottom: 1px solid var(--line); }

.tabbar { position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--line); }
.tabbar__link { display: grid; place-items: center; height: 64px; color: var(--ink-3); }
.tabbar__link.is-active { color: var(--red); }
.tabbar__create { justify-self: center; display: grid; place-items: center; width: 52px; height: 44px; border: 0; border-radius: 16px; background: var(--red); color: #fff; cursor: pointer; }

@media (min-width: 760px) {
  .app { grid-template-columns: 80px minmax(0, 620px); justify-content: center; padding-bottom: 0; }
  .topbar, .tabbar { display: none; }
  .sidebar { display: flex; flex-direction: column; align-items: center; gap: 24px; position: sticky; top: 0; height: 100vh; padding: 20px 0; }
  .sidebar__logo img { border-radius: 14px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav__link { display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 12px; border-radius: 14px; color: var(--ink-2); font-weight: 500; transition: background var(--ease); }
  .nav__link span, .sidebar__post span { display: none; }
  .nav__link:hover { background: var(--surface-2); }
  .nav__link.is-active { color: var(--red); font-weight: 700; }
  .sidebar__post { width: 48px; padding: 0; border-radius: 14px; }
  .main { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}
@media (min-width: 1100px) {
  .app { grid-template-columns: 240px minmax(0, 620px) 300px; gap: 0 8px; }
  .sidebar { align-items: stretch; padding: 20px 16px; }
  .nav__link span, .sidebar__post span { display: inline; }
  .sidebar__post { width: 100%; border-radius: 999px; }
  .aside { display: block; position: sticky; top: 0; align-self: start; padding: 20px 16px; }
}

/* ---------- Page header ---------- */
.page-head { position: sticky; top: 56px; z-index: 10; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.page-head h1 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
@media (min-width: 760px) { .page-head { top: 0; } }

/* ---------- Avatar ---------- */
.avatar { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: var(--avatar-radius); font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: #fff; }
.avatar--lg { width: 88px; height: 88px; font-size: 2.2rem; }
.tone-0 { background: var(--red); }
.tone-1 { background: var(--ink); }
.tone-2 { background: #8a8a8a; }
.tone-3 { background: var(--red-tint); color: var(--red); }

/* ---------- Notice ---------- */
.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--red-tint); font-size: .875rem; }

/* ---------- Composer ---------- */
.composer { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
.composer__field { flex: 1; min-width: 0; }
.composer textarea { width: 100%; min-height: 44px; padding: 10px 0; border: 0; border-bottom: 1px solid transparent; resize: none; background: none; font-size: 1.0625rem; line-height: 1.5; outline: none; }
.composer textarea::placeholder { color: var(--ink-3); }
.composer:focus-within textarea { border-bottom-color: var(--red); }
.composer__foot { display: none; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
.composer.is-open .composer__foot { display: flex; animation: open 160ms ease; }
.composer__hint { font-size: .875rem; color: var(--ink-3); }
.composer__count { font-size: .875rem; font-variant-numeric: tabular-nums; color: var(--ink-3); margin-right: 12px; }
.composer__count.is-near { color: var(--red); font-weight: 600; }
.composer--inline { display: none; }
@media (min-width: 760px) { .composer--inline { display: flex; } }
@keyframes open { from { opacity: 0; transform: translateY(-4px); } }

/* ---------- Post actions: discreet trigger + centered sheet ---------- */
.post__tools { margin-left:auto; position:relative; flex:none; }
.post__menu-trigger { display:grid; place-items:center; flex:none; width:36px; height:36px; margin-left:auto; border:0; border-radius:50%; color:var(--ink-3); background:transparent; font-size:1.55rem; line-height:1; cursor:pointer; touch-action:pan-y; user-select:none; }
.post__menu-trigger:hover, .post__menu-trigger:focus-visible { background:var(--surface-2); color:var(--ink); }
.post__edit-time { display:block; padding:7px 12px; color:var(--ink-3); font-size:.78rem; }
.post-actions-dialog { width:min(360px,calc(100vw - 32px)); max-height:calc(100dvh - 40px); height:fit-content; margin:auto; padding:12px; border:1px solid var(--line); border-radius:18px; background:var(--surface); color:var(--ink); box-shadow:0 18px 60px rgba(0,0,0,.22); }
.post-actions-dialog::backdrop { background:rgba(15,15,15,.48); }
.post-actions-dialog[open] { animation:open 150ms ease; }
.post-actions-dialog__title { padding:8px 10px 12px; font-weight:700; text-align:center; border-bottom:1px solid var(--line); }
.post-actions-dialog__items { display:grid; gap:4px; padding-top:8px; }
.post-actions-dialog__items button { width:100%; min-height:48px; padding:12px 14px; border:0; border-radius:10px; background:transparent; color:var(--ink); text-align:left; font:inherit; cursor:pointer; }
.post-actions-dialog__items button:hover { background:var(--surface-2); }
.post-actions-dialog__items button.danger { color:var(--red); }
.post-actions-dialog__items button:disabled { opacity:.45; cursor:not-allowed; }
.post-actions-dialog__cancel { width:100%; min-height:44px; margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer; }
.post-actions-dialog textarea,.post-actions-dialog select { width:100%; margin-top:8px; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); }

/* ---------- Posts ---------- */
.post { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); transition: background var(--ease); }
.post--link { cursor: pointer; }
.post--link:hover { background: #fafafa; }
.post__body { flex: 1; min-width: 0; }
.post__meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.post__name { font-weight: 700; }
.post__name:hover { text-decoration: underline; }
.post__user, .post__time { color: var(--ink-3); font-size: .9375rem; }
.post__time:hover { text-decoration: underline; }
.post__text { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.post--focus .post__text { font-size: 1.1875rem; line-height: 1.6; }
.post__actions { display: flex; gap: 8px; margin: 8px 0 0 -10px; }
.action { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 999px; background: none; color: var(--ink-3); font-size: .9375rem; cursor: pointer; transition: color var(--ease), background var(--ease); }
.action:hover { background: var(--surface-2); color: var(--ink); }
.action[data-action="like"][aria-pressed="true"] { color: var(--red); }
.action[aria-pressed="true"] .icon { fill: currentColor; animation: pop 220ms ease; }
@keyframes pop { 50% { transform: scale(1.25); } }

.replies-title { padding: 12px 16px; font-weight: 700; border-bottom: 1px solid var(--line); }

/* ---------- Profile ---------- */
.profile { padding: 24px 16px; border-bottom: 1px solid var(--line); }
.profile__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.profile__top .btn { min-width: 112px; }
.profile__stats span { white-space: nowrap; }
.profile__name { margin-top: 12px; font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
.profile__user { color: var(--ink-3); }
.profile__bio { margin-top: 12px; max-width: 60ch; }
.profile__stats { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 12px; color: var(--ink-3); font-size: .9375rem; }
.profile__stats strong { color: var(--ink); }

/* ---------- Empty + skeleton ---------- */
.empty { padding: 56px 24px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 1.0625rem; }
.skeleton { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
.skeleton i { display: block; background: var(--surface-2); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
.skeleton .avatar-sk { width: 44px; height: 44px; border-radius: var(--avatar-radius); }
.skeleton div { flex: 1; display: grid; gap: 8px; }
.skeleton div i { height: 12px; }
@keyframes pulse { 50% { opacity: .5; } }

/* ---------- Right sidebar ---------- */
.panel { padding: 16px; border: 1px solid var(--line); border-radius: 16px; }
.panel__title { margin-bottom: 8px; font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; }
.people a { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.people .avatar { width: 40px; height: 40px; font-size: .95rem; }
.people strong { display: block; line-height: 1.2; }
.people a:hover strong { text-decoration: underline; }
.people small { color: var(--ink-3); }
.aside__note { margin-top: 16px; padding: 0 4px; font-size: .8125rem; color: var(--ink-3); }

/* ---------- Dialog + toast ---------- */
.dialog { width: min(560px, calc(100vw - 24px)); padding: 0; border: 0; border-radius: 16px; background: var(--surface); color: var(--ink); }
.dialog::backdrop { background: rgba(20, 20, 20, .45); }
.dialog[open] { animation: open 160ms ease; }
.dialog__head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0 16px; }
.dialog__head h2 { font-family: var(--font-display); font-size: 1.125rem; font-weight: 600; }
.dialog .composer { border-bottom: 0; }
@media (max-width: 759px) {
  .dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
}
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 60; max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: .9375rem; text-align: center; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity var(--ease), transform var(--ease); }
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 760px) { .toast { bottom: 32px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Stage 2: forms, search, small dialogs ---------- */
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.dialog__body { padding: 16px; }
.dialog.dialog--sm { width: min(400px, calc(100vw - 24px)); height: fit-content; max-height: none; margin: auto; border-radius: 16px; }
.dialog__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dialog p { color: var(--ink-2); }
.topbar__link { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: var(--red); font-weight: 600; }
.field { display: grid; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 600; font-size: .9375rem; }
.field input, .field textarea.input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #b5b5b5; border-radius: 10px; background: var(--surface); }
.field input:focus, .field textarea.input:focus { border-color: var(--red); outline: 2px solid var(--red-tint); }
.field [aria-invalid="true"] { border-color: var(--red); }
.field__error { min-height: 0; color: var(--red); font-size: .875rem; }
.field__help { color: var(--ink-3); font-size: .8125rem; }
.auth { max-width: 420px; margin: 0 auto; padding: 32px 16px 48px; }
.auth__logo { width: 150px; margin-bottom: 24px; }
.auth h1 { margin-bottom: 4px; font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; }
.auth__sub { margin-bottom: 24px; color: var(--ink-2); }
.auth .btn { width: 100%; }
.auth__switch { margin-top: 20px; text-align: center; color: var(--ink-2); }
.auth__switch a { color: var(--red); font-weight: 600; }
.auth__notice { margin-top: 16px; padding: 12px 16px; border-radius: 10px; background: var(--red-tint); font-size: .9375rem; }
.searchbar { position: relative; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.searchbar input { width: 100%; min-height: 48px; padding: 0 48px 0 44px; border: 1px solid transparent; border-radius: 999px; background: var(--surface-2); font: inherit; }
.searchbar input:focus { outline: none; border-color: var(--red); background: var(--surface); }
.searchbar > .icon { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 20px; height: 20px; pointer-events: none; }
.searchbar .icon-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; }
.states { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: .8125rem; color: var(--ink-3); }
.states button { min-height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); text-decoration: underline; cursor: pointer; }
.section-title { padding: 12px 16px 4px; font-weight: 700; }
.person { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.person:hover { background: #fafafa; }
.person strong { display: block; line-height: 1.2; }
.person small { color: var(--ink-3); }
.empty--error strong { color: var(--red); }
.empty .btn { margin-top: 16px; }

.avatar { overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.action[disabled] { opacity: .6; cursor: wait; }
.empty small { display: block; margin-top: 8px; color: var(--ink-3); }
[hidden] { display: none !important; }
.dialog { overflow-y: auto; overflow-x: hidden; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
.visually-hidden:focus-visible + label { outline: 2px solid var(--red); outline-offset: 2px; }
label.btn { cursor: pointer; }
.field__label { font-weight: 600; font-size: .9375rem; }
.avatar-edit { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
.avatar-edit__actions { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }


/* ==========================================================
   KOTOBA — visual refresh: cozy study-app aesthetic
   Visual-only overrides; existing HTML structure and JS stay intact.
   ========================================================== */
:root {
  --red: #b94b57;
  --red-hover: #963946;
  --red-tint: #f9e9e9;
  --ink: #292b3a;
  --ink-2: #626477;
  --ink-3: #898b9b;
  --line: #e9e5e1;
  --surface: #fffefa;
  --surface-2: #f5f1ed;
  --ease: 180ms cubic-bezier(.2,.7,.2,1);
  --avatar-radius: 34%;
}
html { background: #f4f1ed; }
body {
  color: var(--ink);
  background:
    radial-gradient(ellipse at 8% 4%, rgba(239,216,207,.52), transparent 34rem),
    radial-gradient(ellipse at 92% 28%, rgba(218,226,238,.45), transparent 30rem),
    #f4f1ed;
  font-size: 15px;
}
button, input, textarea, select { accent-color: var(--red); }
.app { max-width: 1440px; margin: 0 auto; }
.main { background: rgba(255,254,250,.88); box-shadow: 0 0 50px rgba(58,48,45,.035); }
.topbar {
  height: 62px; background: rgba(255,254,250,.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(224,217,210,.8);
}
.page-head {
  min-height: 66px; padding: 0 20px;
  background: rgba(255,254,250,.94); backdrop-filter: blur(14px);
  border-bottom: 1px solid #eee8e2;
}
.page-head h1 { color: #303246; font-size: 1.35rem; letter-spacing: -.025em; }
.sidebar { background: transparent; }
.sidebar__logo img { box-shadow: 0 5px 16px rgba(185,75,87,.14); }
.nav__link { border-radius: 15px; color: #686a7b; }
.nav__link:hover, .tabbar__link:hover { background: #eee9e5; }
.nav__link.is-active, .tabbar__link.is-active { color: var(--red); background: #f8e9e8; }
.btn { min-height: 43px; font-weight: 650; letter-spacing: .005em; box-shadow: 0 2px 5px rgba(42,35,35,.035); }
.btn--primary { background: linear-gradient(135deg,#c45d68,#a94351); box-shadow: 0 5px 13px rgba(185,75,87,.18); }
.btn--primary:hover { background: linear-gradient(135deg,#b14d5a,#963946); }
.btn--outline { border-color: #e6ded8; background: #fffefa; color: #55576a; }
.btn--outline:hover { background: #f7f1ed; border-color: #d8cbc3; }
.icon-btn { color: #77798a; }
.icon-btn:hover { background: #f1ebe7; color: var(--red); }
.tabbar {
  left: 12px; right: 12px; bottom: calc(8px + env(safe-area-inset-bottom));
  height: 62px; padding: 0 8px; border: 1px solid rgba(226,218,211,.95);
  border-radius: 21px; background: rgba(255,254,250,.94); backdrop-filter: blur(18px);
  box-shadow: 0 8px 28px rgba(50,43,40,.12);
}
.tabbar__link { height: 54px; border-radius: 15px; }
.tabbar__create { width: 48px; height: 44px; border-radius: 15px; box-shadow: 0 5px 13px rgba(185,75,87,.2); }
.app { padding-bottom: calc(82px + env(safe-area-inset-bottom)); }
@media (min-width:760px) {
  .app { padding-bottom: 0; }
  .main { border: 1px solid #ebe5df; border-top: 0; border-bottom: 0; }
}
.composer {
  margin: 14px 14px 10px; padding: 16px; border: 1px solid #eee6df;
  border-radius: 20px; background: linear-gradient(145deg,#fffefa,#fbf7f2);
  box-shadow: 0 5px 18px rgba(54,45,39,.045);
}
.composer textarea { color: var(--ink); }
.composer textarea::placeholder { color: #9b98a0; }
.composer:focus-within { border-color: #e2b8b8; box-shadow: 0 0 0 3px rgba(185,75,87,.07),0 7px 20px rgba(54,45,39,.05); }
.notice { margin: 12px 14px; border: 1px solid #f0d9d8; border-radius: 16px; background: #fbefed; color: #6d5055; }
.post {
  position: relative; margin: 12px 14px; padding: 17px;
  border: 1px solid #eee7e1; border-radius: 20px;
  background: #fffefa; box-shadow: 0 4px 15px rgba(53,45,40,.045);
}
.post:last-child { margin-bottom: 18px; }
.post--link:hover { background: #fffdfa; border-color: #e5d5ce; box-shadow: 0 7px 20px rgba(53,45,40,.075); }
.post__name { color: #303246; font-weight: 750; }
.post__user, .post__time { font-size: .85rem; color: #92909a; }
.post__text { margin-top: 8px; color: #444658; line-height: 1.65; font-size: .98rem; }
.post__actions { margin-top: 12px; padding-top: 8px; border-top: 1px solid #f1ece7; }
.action { color: #858393; }
.action:hover { background: #f7efeb; color: var(--red); }
.post__menu-trigger { border: 1px solid transparent; background: #f8f4f0; color: #777789; }
.post__menu-trigger:hover { background: #f3e8e5; color: var(--red); }
.profile { margin: 14px; padding: 22px; border: 1px solid #eee6df; border-radius: 22px; background: linear-gradient(145deg,#fffefa,#faf5f0); box-shadow: 0 5px 18px rgba(54,45,39,.045); }
.profile__name { color: #303246; }
.profile__stats { gap: 8px 18px; }
.profile__stats > * { padding: 7px 11px; border-radius: 12px; background: #f5efea; }
/* ---------- Perfil: cabecera estilo Instagram ---------- */
.profile__top { align-items: center; justify-content: flex-start; gap: 18px; }
.profile__ring { flex: none; padding: 6px; border-radius: 34%; background: linear-gradient(135deg, #f40409 0%, #ff7a45 55%, #ffb347 100%); box-shadow: 0 10px 24px rgba(208,18,22,.20); }
.profile__ring .avatar { box-shadow: 0 0 0 3px #fffefa; }
.profile__counts { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 4px; border: 1px solid #efe5de; border-radius: 20px; background: rgba(255,255,255,.72); box-shadow: 0 4px 14px rgba(54,45,39,.05), inset 0 1px 0 #fff; }
.pstat { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 0 4px; text-align: center; }
.pstat + .pstat { border-left: 1px solid #f0e6df; }
.pstat strong { font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; color: #303246; }
.pstat span { font-size: .72rem; font-weight: 600; letter-spacing: .02em; color: var(--ink-3); white-space: nowrap; }
.profile__user { margin-top: 1px; }
.profile__joined { margin-top: 10px; font-size: .84rem; color: var(--ink-3); }
.profile__actions { margin-top: 16px; }
.profile__actions .btn { width: 100%; min-width: 0; }
@media (max-width:420px) {
  .profile__top { gap: 12px; }
  .profile__ring { padding: 5px; }
  .profile__ring .avatar--lg { width: 70px; height: 70px; font-size: 1.8rem; }
  .pstat strong { font-size: 1.2rem; }
  .pstat span { font-size: .66rem; letter-spacing: 0; }
}
.replies-title, .section-title { color: #45475b; }
.replies-title { margin: 12px 14px 0; padding: 13px 16px; border: 1px solid #eee6df; border-radius: 16px 16px 0 0; background: #f8f3ee; }
.panel { border-color: #eae2dc; border-radius: 20px; background: rgba(255,254,250,.88); box-shadow: 0 5px 18px rgba(54,45,39,.04); }
.person { border-color: #f0eae5; }
.person:hover { background: #faf5f0; }
.searchbar { padding: 15px 18px; border-color: #eee8e2; }
.searchbar input { border: 1px solid #eee6df; background: #f8f4f0; }
.searchbar input:focus { border-color: #d9a6a8; background: #fffefa; box-shadow: 0 0 0 3px rgba(185,75,87,.07); }
.states { background: #fbf8f4; border-color: #eee8e2; }
.empty { margin: 18px 14px; padding: 48px 22px; border: 1px dashed #e4d8d0; border-radius: 20px; background: rgba(255,254,250,.72); }
.empty strong { color: #383a4e; }
.skeleton { margin: 12px 14px; border: 1px solid #eee7e1; border-radius: 18px; background: #fffefa; }
.skeleton i { background: #eee8e3; }
.auth {
  margin-top: 26px; padding: 28px 24px 30px; border: 1px solid #eee5de;
  border-radius: 24px; background: #fffefa; box-shadow: 0 12px 36px rgba(53,45,40,.075);
}
.auth__logo { width: 128px; }
.auth h1 { color: #303246; letter-spacing: -.03em; }
.auth__sub { color: #777789; }
.field { gap: 7px; }
.field label { color: #4a4b5d; }
.field input, .field textarea.input {
  border: 1px solid #e8dfd8; border-radius: 13px; background: #fcfaf7;
  transition: border-color var(--ease), box-shadow var(--ease);
}
.field input:focus, .field textarea.input:focus { border-color: #d5a0a3; outline: none; box-shadow: 0 0 0 3px rgba(185,75,87,.09); }
.dialog { border: 1px solid #eee5de; border-radius: 22px; box-shadow: 0 20px 70px rgba(40,34,34,.2); }
.dialog::backdrop { background: rgba(39,38,51,.48); backdrop-filter: blur(3px); }
.dialog__head { padding: 14px 14px 0 20px; }
.dialog__head h2 { color: #303246; }
.dialog__body { padding: 20px; }
.post-actions-dialog { border: 1px solid #eee5de; border-radius: 23px; background: #fffefa; box-shadow: 0 22px 70px rgba(35,32,39,.25); }
.post-actions-dialog__title { color: #383a4e; }
.post-actions-dialog__items button { border-radius: 13px; }
.post-actions-dialog__items button:hover { background: #f7efeb; }
.post-actions-dialog__cancel { border-color: #e9e0d9; background: #f8f4f0; }
.toast { background: #343648; box-shadow: 0 8px 24px rgba(35,32,39,.22); }
@media (max-width:759px) {
  .page-head { top: 62px; }
  .post { margin: 10px 11px; padding: 15px; }
  .composer { margin: 11px; }
  .profile { margin: 11px; }
  .auth { margin: 20px 14px; padding: 24px 20px; }
}
@media (prefers-reduced-motion:no-preference) {
  .post, .panel, .auth, .composer { transition: box-shadow var(--ease), transform var(--ease), border-color var(--ease); }
  .post:hover { transform: translateY(-1px); }
}


/* ---------- Ajustes ---------- */
.topbar__settings { margin-left: auto; }
.page-head__action { margin-left: auto; }
@media (max-width: 759px) { .page-head__action { display: none; } }

.settings-list { display: grid; gap: 20px; padding: 14px 14px 32px; }

.settings-hero { position: relative; display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 24px; color: #fff; background: linear-gradient(135deg, var(--red) 0%, var(--red-hover) 100%); box-shadow: 0 14px 34px rgba(54, 45, 39, .22); overflow: hidden; }
.settings-hero::after { content: ""; position: absolute; right: -46px; top: -46px; width: 180px; height: 180px; border-radius: 38%; background: rgba(255, 255, 255, .1); }
.settings-hero > * { position: relative; z-index: 1; }
.settings-hero .avatar { width: 68px; height: 68px; font-size: 1.7rem; background: #fff; color: var(--red); box-shadow: 0 0 0 3px rgba(255, 255, 255, .4); }
.settings-hero__text { min-width: 0; }
.settings-hero h2 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.settings-hero p { font-size: .9rem; opacity: .92; overflow-wrap: anywhere; }
.settings-hero__mail { opacity: .8; font-size: .8125rem; }
.settings-hero__link { display: inline-flex; align-items: center; min-height: 32px; margin-top: 10px; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .2); font-size: .8125rem; font-weight: 700; transition: background var(--ease); }
.settings-hero__link:hover { background: rgba(255, 255, 255, .32); }

.settings-feature { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #eae2dc; border-radius: 20px; background: #fffefa; box-shadow: 0 5px 18px rgba(54, 45, 39, .05); transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease); }
.settings-feature:hover { border-color: var(--red); box-shadow: 0 10px 26px rgba(54, 45, 39, .12); transform: translateY(-1px); }

.settings-tile { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 13px; }
.settings-tile .icon { width: 22px; height: 22px; }
.settings-tile--red { background: var(--red); color: #fff; }
.settings-tile--tint { background: var(--red-tint); color: var(--red); }
.settings-tile--ink { background: var(--ink); color: #fff; }
.settings-tile--soft { background: #f3ece6; color: var(--ink-2); }

.settings-row__text { display: grid; flex: 1; min-width: 0; text-align: left; }
.settings-row__text strong { color: #303246; font-weight: 700; overflow-wrap: anywhere; }
.settings-row__text small { color: var(--ink-3); font-size: .8125rem; overflow-wrap: anywhere; }
.settings-chevron { flex: none; width: 20px; height: 20px; color: #a7a2a0; transition: transform var(--ease), color var(--ease); }

.settings-group__title { padding: 0 6px 8px; color: #8a8590; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.settings-card { overflow: hidden; border: 1px solid #eae2dc; border-radius: 20px; background: #fffefa; box-shadow: 0 5px 18px rgba(54, 45, 39, .04); }
.settings-card > * + * { border-top: 1px solid #f0eae5; }
.settings-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 16px; cursor: pointer; transition: background var(--ease); }
.settings-row--static { cursor: default; }
a.settings-row:hover, summary.settings-row:hover { background: #faf5f0; }
a.settings-row:hover .settings-chevron, summary.settings-row:hover .settings-chevron { color: var(--red); }

.settings-expand > summary { list-style: none; }
.settings-expand > summary::-webkit-details-marker { display: none; }
.settings-expand[open] > summary { background: #faf5f0; }
.settings-expand[open] > summary .settings-chevron { transform: rotate(90deg); color: var(--red); }

.settings-form { display: grid; gap: 10px; padding: 8px 16px 18px 72px; }
.settings-form label { color: #4a4b5d; font-size: .8125rem; font-weight: 600; }
.settings-form input { width: 100%; min-height: 46px; padding: 0 14px; border: 1px solid #e8dfd8; border-radius: 13px; background: #fcfaf7; font: inherit; transition: border-color var(--ease), box-shadow var(--ease); }
.settings-form input:focus { border-color: #d5a0a3; outline: none; box-shadow: 0 0 0 3px rgba(185, 75, 87, .09); }
.settings-hint { color: var(--ink-3); font-size: .8125rem; line-height: 1.5; }
.settings-hint--pad { padding: 10px 16px 16px; }
.settings-legal { padding: 4px 16px 18px 72px; color: var(--ink-2); font-size: .9rem; line-height: 1.6; }
.settings-legal p + p { margin-top: 8px; }
@media (max-width: 520px) { .settings-form, .settings-legal { padding-left: 16px; } }

.settings-segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 4px 16px 0; padding: 4px; border-radius: 14px; background: #f3ece6; }
.settings-segment button { min-height: 40px; border: 0; border-radius: 11px; background: none; color: var(--ink-2); font: inherit; font-weight: 600; cursor: not-allowed; opacity: .6; }
.settings-segment button.is-active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(54, 45, 39, .14); opacity: 1; }

.switch { position: relative; flex: none; width: 46px; height: 28px; }
.switch input { position: absolute; inset: 0; margin: 0; opacity: 0; }
.switch__track { position: absolute; inset: 0; border-radius: 999px; background: #d8d2cd; transition: background var(--ease); }
.switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform var(--ease); }
.switch input:checked + .switch__track { background: var(--red); }
.switch input:checked + .switch__track::after { transform: translateX(18px); }
.switch input:disabled + .switch__track { opacity: .55; }

.settings-signout { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; border: 1px solid #f1c4c5; border-radius: 18px; background: var(--red-tint); color: var(--red); font: inherit; font-weight: 700; cursor: pointer; transition: background var(--ease), border-color var(--ease), color var(--ease); }
.settings-signout:hover { border-color: var(--red); background: var(--red); color: #fff; }

.post--reply .post__actions { margin-top: 4px; padding-top: 0; border-top: 0; }
.action[data-action="like-reply"][aria-pressed="true"] { color: var(--red); }
/* Ficha de opciones (los 3 puntos): ocupa solo lo que necesita, centrada. No depende de height:fit-content. */
.post-actions-dialog { position: fixed; top: 50%; left: 50%; right: auto; bottom: auto; margin: 0; width: min(340px, calc(100vw - 32px)); height: auto; max-height: calc(100vh - 40px); overflow-y: auto; transform: translate(-50%, -50%); }
.post-actions-dialog[open] { animation: post-menu-in 150ms ease; }
@keyframes post-menu-in { from { opacity: 0; transform: translate(-50%, calc(-50% + 8px)); } }
.post-actions-dialog__items button.danger { color: var(--red); }
</style>

  <script>
const SUPABASE_URL = "https://pyilujaulcuntsdfofjx.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_iwsFEmZjTK2Sj83ut0qFzQ_b3X-p8mO";

/* ==========================================================
   KOTOBA - connected to Supabase
   Tables used (exact names): profiles, posts, likes, replies.
   Only the publishable key lives here. Never put a secret or
   service_role key in this file. Security is enforced by RLS.
   ========================================================== */

const MAX_POST_LENGTH = 500;
const PAGE_SIZE = 50;
const PROFILE_COLUMNS = "id, username, display_name, bio, avatar_url, created_at";
const POST_COLUMNS = "id, user_id, content, created_at";
const REPLY_COLUMNS = "id, user_id, post_id, content, created_at";
const AVATAR_BUCKET = "avatars";                 // Supabase Storage bucket for profile photos
const AVATAR_SIZE = 512;                         // photos are cropped to a 512x512 square before upload
const AVATAR_MAX_INPUT_BYTES = 8 * 1024 * 1024;  // largest file we accept before resizing
const avatarDraft = { blob: null, previewUrl: null, remove: false }; // changes waiting for "Save changes"

// supabase-js wants the project root URL. The constant above ends in /rest/v1/, so we trim that part.
const PROJECT_URL = SUPABASE_URL.replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, "");
let db = null;
try {
  db = window.supabase.createClient(PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);
} catch (error) {
  console.error("Supabase client could not be created:", error);
}

const state = { session: null, me: null }; // me = the signed-in user's row from `profiles`
let renderToken = 0; // lets slow requests notice the page has changed and stop

/* ---------- Helpers ---------- */
const $ = (selector, root = document) => root.querySelector(selector);
const view = $("#view");
const WORDMARK = $(".topbar img").src;

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function timeAgo(iso) {
  const minutes = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (minutes < 1) return "now";
  if (minutes < 60) return `${minutes}m`;
  if (minutes < 1440) return `${Math.floor(minutes / 60)}h`;
  if (minutes < 43200) return `${Math.floor(minutes / 1440)}d`;
  return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
const fmtCount = (n) => (n >= 10000 ? new Intl.NumberFormat("es", { notation: "compact", maximumFractionDigits: 1 }).format(n) : String(n));
const joinedLabel = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "long", year: "numeric" });

/* Awaits a Supabase query and throws if Supabase reported an error. */
async function run(query) {
  const { data, error, count } = await query;
  if (error) throw error;
  return { data, count };
}
const errorText = (error) => (error && error.message ? error.message : "Something went wrong.");

function errorHtml(message, error, retryAction = "reload-view") {
  console.error(message, error);
  return `<div class="empty empty--error"><strong>${escapeHtml(message)}</strong>Check your connection and try again.<small>${escapeHtml(errorText(error))}</small><button class="btn btn--outline" type="button" data-action="${retryAction}">Try again</button></div>`;
}
const skeletonHtml = (n = 3) => Array.from({ length: n }, () => `<div class="skeleton"><i class="avatar-sk"></i><div><i style="width:40%"></i><i></i><i style="width:75%"></i></div></div>`).join("");

async function loadProfilesById(ids) {
  if (!ids.length) return {};
  const { data } = await run(db.from("profiles").select(PROFILE_COLUMNS).in("id", ids));
  return Object.fromEntries(data.map((p) => [p.id, p]));

/* Adds author, like count, "liked by me" and reply count to a list of post rows. */
async function hydratePosts(rows) {
  const ids = rows.map((r) => r.id);
  const [authors, likes, replies, savedRows] = await Promise.all([
    loadProfilesById([...new Set(rows.map((r) => r.user_id))]),
    ids.length ? run(db.from("likes").select("user_id, post_id").in("post_id", ids)) : { data: [] },
    ids.length ? run(db.from("replies").select("post_id").in("post_id", ids)) : { data: [] },
    state.me && ids.length ? run(db.from("saved_posts").select("post_id").eq("user_id", state.me.id).in("post_id", ids)) : { data: [] },
  ]);
  return rows.map((row) => ({
    ...row,
    author: authors[row.user_id] || null,
    likeCount: likes.data.filter((l) => l.post_id === row.id).length,
    liked: !!state.me && likes.data.some((l) => l.post_id === row.id && l.user_id === state.me.id),
    replyCount: replies.data.filter((r) => r.post_id === row.id).length,
    savedByMe: savedRows.data.some((r) => r.post_id === row.id),
  }));
}
async function withAuthors(rows) {
  const authors = await loadProfilesById([...new Set(rows.map((r) => r.user_id))]);
  return rows.map((row) => ({ ...row, author: authors[row.user_id] || null }));
}

}

function toneOf(username) {
  let hash = 0;
  for (const char of username || "") hash = (hash * 31 + char.charCodeAt(0)) % 4;
  return hash;
}
function avatarHtml(profile, large = false) {
  const name = profile?.display_name || profile?.username || "?";
  const url = profile?.avatar_url;
  const hasImage = typeof url === "string" && /^https:\/\//i.test(url);
  const initial = name.charAt(0).toUpperCase();
  const inner = hasImage ? `<img src="${escapeHtml(url)}" alt="" referrerpolicy="no-referrer" data-initial="${escapeHtml(initial)}">` : escapeHtml(initial);
  return `<span class="avatar tone-${toneOf(profile?.username)}${large ? " avatar--lg" : ""}" aria-hidden="true">${inner}</span>`;
}
const profileHref = (profile) => (profile?.username ? `#/u/${encodeURIComponent(profile.username)}` : "#/home");

/* ============================================================
   ME GUSTA EN COMENTARIOS (respuestas): la interfaz está lista.
   Para conectarlo a Supabase solo hay que completar estas 3 funciones
   de replyLikesBackend y poner enabled = true:
     load(replyIds) -> { counts: { [replyId]: número }, mine: [replyId, ...] }
                       (cuántos me gusta tiene cada comentario y cuáles diste vos)
     like(replyId)   -> guarda el me gusta del usuario actual (state.me.id)
     unlike(replyId) -> lo quita
   Si like/unlike lanzan un error, el botón vuelve a su estado anterior
   y se muestra el mensaje. Mientras enabled sea false, el me gusta solo se
   ve en esta pestaña y se pierde al recargar (vista previa).
   ============================================================ */
const replyLikesBackend = {
  enabled: true,
  async load(replyIds) {
    if (!replyIds.length) return { counts: {}, mine: [] };
    const { data } = await run(
      db.from("reply_likes")
        .select("reply_id, user_id")
        .in("reply_id", replyIds)
    );
    const counts = {};
    const mine = [];
    for (const like of data || []) {
      counts[like.reply_id] = (counts[like.reply_id] || 0) + 1;
      if (state.me && like.user_id === state.me.id) mine.push(like.reply_id);
    }
    return { counts, mine };
  },
  async like(replyId) {
    if (!state.me) throw new Error("Iniciá sesión para dar me gusta.");
    const { error } = await db.from("reply_likes").insert({
      reply_id: replyId,
      user_id: state.me.id,
    });
    // 23505 significa que ese usuario ya había dado me gusta.
    if (error && error.code !== "23505") throw error;
  },
  async unlike(replyId) {
    if (!state.me) throw new Error("Iniciá sesión para quitar el me gusta.");
    await run(
      db.from("reply_likes")
        .delete()
        .eq("reply_id", replyId)
        .eq("user_id", state.me.id)
    );
  },
};
const replyLikeState = new Map(); // replyId -> { liked, count }
let replyLikePreviewNotified = false;

/* Loads counts and "liked by me" for the replies on screen (only when the backend is connected). */
async function loadReplyLikes(replies) {
  if (!replyLikesBackend.enabled || !replies.length) return;
  try {
    const { counts = {}, mine = [] } = await replyLikesBackend.load(replies.map((r) => r.id));
    const mineSet = new Set(mine);
    replies.forEach((r) => replyLikeState.set(r.id, { liked: mineSet.has(r.id), count: Number(counts[r.id] || 0) }));
  } catch (error) {
    console.error("No se pudieron cargar los me gusta de los comentarios:", error);
  }
}

function replyActionsHtml(item) {
  const view = replyLikeState.get(item.id) || { liked: false, count: 0 };
  return `<div class="post__actions">
        <button class="action" type="button" data-action="like-reply" data-id="${item.id}" aria-pressed="${view.liked}" aria-label="Me gusta">
          <svg class="icon"><use href="#i-heart"/></svg><span class="like-count">${view.count}</span>
        </button>
      </div>`;
}

async function toggleReplyLike(button) {
  if (!state.me) { showToast("Iniciá sesión para dar me gusta."); return; }
  if (button.disabled) return;
  const id = button.dataset.id;
  const wasLiked = button.getAttribute("aria-pressed") === "true";
  const counter = $(".like-count", button);
  const apply = (liked) => {
    const count = Math.max(0, Number(counter.textContent) + (liked ? 1 : -1));
    button.setAttribute("aria-pressed", liked);
    counter.textContent = count;
    replyLikeState.set(id, { liked, count });
  };
  apply(!wasLiked); // se ve al instante; si el servidor falla, se deshace
  button.disabled = true;
  try {
    if (replyLikesBackend.enabled) {
      if (wasLiked) await replyLikesBackend.unlike(id);
      else await replyLikesBackend.like(id);
    } else if (!replyLikePreviewNotified) {
      replyLikePreviewNotified = true;
      showToast("Vista previa: los me gusta de comentarios todavía no se guardan.");
    }
  } catch (error) {
    console.error(error);
    apply(wasLiked);
    showToast("No se pudo actualizar el me gusta. " + errorText(error));
  } finally {
    button.disabled = false;
  }
}

/* Adds behaviour to a composer. onSubmit(text) must return a promise; if it throws, the text is kept. */
function setupComposer(form, onSubmit) {
  if (!form) return;
  const box = $("textarea", form);
  const button = $("button[type=submit]", form);
  const count = $(".composer__count", form);
  const hint = $(".composer__hint", form);
  let busy = false;

  const update = () => {
    const isEmpty = box.value.trim() === "";
    box.style.height = "auto";
    box.style.height = box.scrollHeight + "px";
    count.textContent = `${box.value.length} / ${MAX_POST_LENGTH}`;
    count.classList.toggle("is-near", box.value.length >= MAX_POST_LENGTH - 50);
    button.disabled = isEmpty || busy;
    hint.hidden = !isEmpty;
  };
  box.addEventListener("input", update);
  form.addEventListener("focusin", () => form.classList.add("is-open"));
  form.addEventListener("focusout", (e) => {
    if (!form.contains(e.relatedTarget) && box.value === "" && !form.closest("dialog")) form.classList.remove("is-open");
  });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = box.value.trim();
    if (!text || busy) return;
    busy = true;
    update();
    try {
      await onSubmit(text);
    } catch (error) {
      console.error(error);
      showToast(errorText(error));
    } finally {
      busy = false;
      update();
    }
  });
  update();
}

/* Checks the picked file, crops it to a square and compresses it (usually under 100 KB). */
async function prepareAvatar(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("Choose a JPG, PNG or WebP image.");
  if (file.size > AVATAR_MAX_INPUT_BYTES) throw new Error("That image is too large. Choose one under 8 MB.");
  let bitmap;
  try { bitmap = await createImageBitmap(file); } catch (error) { throw new Error("That image couldn't be read. Try another one."); }
  const side = Math.min(bitmap.width, bitmap.height);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = AVATAR_SIZE;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, AVATAR_SIZE, AVATAR_SIZE);
  ctx.drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, AVATAR_SIZE, AVATAR_SIZE);
  if (bitmap.close) bitmap.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.88));
  if (!blob) throw new Error("The image couldn't be processed.");
  return blob;
}

/* Files live in the bucket as <user id>/avatar-<time>.jpg. The folder name is what the Storage policies check. */
async function uploadAvatar(blob) {
  const path = `${state.me.id}/avatar-${Date.now()}.jpg`;
  const { error } = await db.storage.from(AVATAR_BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "3600", upsert: false });
  if (error) throw new Error("Photo upload failed: " + error.message);
  const { data } = db.storage.from(AVATAR_BUCKET).getPublicUrl(path);
  return { path, url: data.publicUrl };
}
function avatarPathFromUrl(url) {
  const marker = `/storage/v1/object/public/${AVATAR_BUCKET}/`;
  if (typeof url !== "string" || !url.includes(marker)) return null;
  return decodeURIComponent(url.split(marker)[1].split("?")[0]);
}
async function removeAvatarFile(path) {
  if (!path) return;
  const { error } = await db.storage.from(AVATAR_BUCKET).remove([path]);
  if (error) console.warn("Could not delete a photo file:", error);
}

/* ---------- Search ---------- */
let searchSeq = 0;
let searchTimer;
function renderSearch() {
  ++renderToken;
  view.innerHTML = `
    <div class="page-head"><h1>Search</h1></div>
    <div class="searchbar" role="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search people and posts" aria-label="Search people and posts" autocomplete="off">
      <button class="icon-btn" type="button" data-action="clear-search" aria-label="Clear search" hidden><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="results" aria-live="polite"></div>`;
  $("#q").addEventListener("input", (e) => {
    $("[data-action=clear-search]").hidden = e.target.value === "";
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => doSearch(e.target.value), 300);
  });
  doSearch("");
}
async function doSearch(query) {
  const out = $("#results");
  if (!out) return;
  const seq = ++searchSeq;
  const q = query.trim();
  if (!q) { out.innerHTML = `<div class="empty"><strong>Find people and posts</strong>Type a name, a username or a word from a post.</div>`; return; }
  out.innerHTML = skeletonHtml(2);
  const pattern = `%${q.replace(/[\\%_]/g, "\\$&")}%`;
  let html;
  try {
    const [byUsername, byName, byContent] = await Promise.all([
      run(db.from("profiles").select(PROFILE_COLUMNS).ilike("username", pattern).limit(10)),
      run(db.from("profiles").select(PROFILE_COLUMNS).ilike("display_name", pattern).limit(10)),
      run(db.from("posts").select(POST_COLUMNS).ilike("content", pattern).order("created_at", { ascending: false }).limit(20)),
    ]);
    const people = [...new Map([...byUsername.data, ...byName.data].map((p) => [p.id, p])).values()];
    const posts = await hydratePosts(byContent.data);
    html = !people.length && !posts.length
      ? `<div class="empty"><strong>No results for “${escapeHtml(q)}”</strong>Check the spelling or try a different word.</div>`
      : (people.length ? `<h2 class="section-title">People</h2>` + people.map((p) => `<a class="person" href="${escapeHtml(profileHref(p))}">${avatarHtml(p)}<span><strong>${escapeHtml(p.display_name || p.username)}</strong><small>@${escapeHtml(p.username)}</small></span></a>`).join("") : "") +
        (posts.length ? `<h2 class="section-title">Posts</h2>` + posts.map((p) => postHtml(p)).join("") : "");
  } catch (error) {
    html = errorHtml("Search failed.", error, "retry-search");
  }
  if (seq === searchSeq && $("#results") === out) out.innerHTML = html;
}

const authFields = {
  email: { label: "Email", type: "email", auto: "email", check: (v) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || "Enter a valid email address." },
  username: { label: "Username", type: "text", auto: "username", help: "3 to 20 letters, numbers or underscores.", check: (v) => /^[a-z0-9_]{3,20}$/i.test(v) || "Use 3 to 20 letters, numbers or underscores." },
  displayName: { label: "Display name", type: "text", auto: "name", check: (v) => v.trim().length >= 1 || "Enter the name people will see." },
  password: { label: "Password", type: "password", auto: "new-password", help: "At least 8 characters.", check: (v) => v.length >= 8 || "Use at least 8 characters." },
  confirm: { label: "Confirm password", type: "password", auto: "new-password", check: (v, all) => v === all.password || "Passwords don't match." },
};

function renderAuth(mode) {
  ++renderToken;
  if (state.session) { location.hash = "#/home"; return; }
  const signup = mode === "signup";
  const keys = signup ? ["email", "username", "displayName", "password", "confirm"] : ["email", "password"];
  view.innerHTML = `
    <section class="auth">
      <img class="auth__logo" src="${WORDMARK}" alt="Kotoba">
      <h1>${signup ? "Create your account" : "Welcome back"}</h1>
      <p class="auth__sub">${signup ? "Short posts, public conversations." : "Sign in to keep the conversation going."}</p>
      <form id="auth-form" novalidate>
        ${keys.map((k) => { const f = authFields[k]; return `
        <div class="field">
          <label for="f-${k}">${f.label}</label>
          <input id="f-${k}" name="${k}" type="${f.type}" autocomplete="${k === "password" && !signup ? "current-password" : f.auto}" aria-describedby="e-${k}">
          ${f.help && signup ? `<span class="field__help">${f.help}</span>` : ""}
          <span class="field__error" id="e-${k}"></span>
        </div>`; }).join("")}
        <button class="btn btn--primary" type="submit">${signup ? "Sign up" : "Sign in"}</button>
        <div id="auth-notice" role="status"></div>
      </form>
      <p class="auth__switch">${signup ? `Already have an account? <a href="#/signin">Sign in</a>` : `New to Kotoba? <a href="#/signup">Sign up</a>`}</p>
    </section>`;

  $("#auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const values = Object.fromEntries(keys.map((k) => [k, form.elements[k].value]));
    let firstInvalid = null;
    keys.forEach((k) => {
      const result = !signup && k === "password" ? (values.password ? true : "Enter your password.") : authFields[k].check(values[k], values);
      $("#e-" + k).textContent = result === true ? "" : result;
      form.elements[k].setAttribute("aria-invalid", result !== true);
      if (result !== true && !firstInvalid) firstInvalid = form.elements[k];
    });
    const notice = $("#auth-notice");
    if (firstInvalid) { notice.innerHTML = ""; firstInvalid.focus(); return; }

    const submit = $("button[type=submit]", form);
    submit.disabled = true;
    notice.innerHTML = "";
    const say = (message) => { notice.innerHTML = `<p class="auth__notice">${escapeHtml(message)}</p>`; };
    try {
      if (signup) await signUpUser(values, say);
      else await signInUser(values);
    } catch (error) {
      console.error(error);
      say(errorText(error));
    } finally {
      submit.disabled = false;
    }
  });
}

async function signInUser({ email, password }) {
  const { data, error } = await db.auth.signInWithPassword({ email: email.trim(), password });
  if (error) throw error;
  await handleSession(data.session);
  if (!state.me) throw new Error("Signed in, but your profile could not be loaded.");
  showToast("Signed in");
  location.hash = "#/home";
}

async function signUpUser({ email, username, displayName, password }, say) {
  const wanted = username.trim().toLowerCase();
  const name = displayName.trim();
  // Friendly early check. If RLS hides other profiles this returns nothing and the database still enforces uniqueness.
  const { data: taken, error: lookupError } = await db.from("profiles").select("id").eq("username", wanted).maybeSingle();
  if (lookupError) console.warn("Username check skipped:", lookupError);
  if (taken) throw new Error("That username is already taken.");

  // The trigger creates the profile row. We pass the same names as `profiles` columns as sign-up metadata.
  const { data, error } = await db.auth.signUp({ email: email.trim(), password, options: { data: { username: wanted, display_name: name } } });
  if (error) throw error;
  if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error("An account with this email already exists. Try signing in.");
  if (!data.session) { say("Account created. Check your email to confirm it, then sign in."); return; }

  await handleSession(data.session);
  if (!state.me) throw new Error("Your account was created, but no profile row exists. Check the sign-up trigger in Supabase.");
  if (state.me.username !== wanted || state.me.display_name !== name) {
    // The trigger may not copy our metadata; make sure the profile holds what was typed.
    const { data: updated, error: updateError } = await db.from("profiles").update({ username: wanted, display_name: name }).eq("id", state.me.id).select(PROFILE_COLUMNS).maybeSingle();
    if (updateError) throw new Error(updateError.code === "23505" ? "That username is already taken. Edit it from your profile." : updateError.message);
    if (!updated) throw new Error("Your account was created, but your profile could not be updated (check the RLS update policy).");
    state.me = updated;
    updateChrome();
  }
  showToast("Welcome to Kotoba");
  location.hash = "#/home";
}

async function signOutUser() {
  const { error } = await db.auth.signOut();
  if (error) throw error;
  $("#signout-dialog").close();
  await handleSession(null);
  showToast("Signed out");
  if (location.hash === "#/home" || location.hash === "") route(); else location.hash = "#/home";
}

async function toggleFollow(button) {
  if (!state.me) { location.hash = "#/signin"; return; }
  if (button.disabled) return;
  const userId = button.dataset.userId;
  const username = button.dataset.username;
  if (!userId || userId === state.me.id) return;
  const wasFollowing = button.getAttribute("aria-pressed") === "true";
  button.disabled = true;
  button.textContent = wasFollowing ? "Dejando de seguir…" : "Siguiendo…";
  try {
    if (wasFollowing) {
      const { data, error } = await db.from("followers")
        .delete()
        .eq("follower_id", state.me.id)
        .eq("following_id", userId)
        .select();
      if (error) throw error;
      if (!data?.length) throw new Error("No se pudo dejar de seguir a este usuario.");
    } else {
      const { error } = await db.from("followers").insert({
        follower_id: state.me.id,
        following_id: userId,
      });
      if (error && error.code !== "23505") throw error;
    }
    showToast(wasFollowing ? "Dejaste de seguir a @" + username : "Ahora sigues a @" + username);
    await renderProfile(username);
  } catch (error) {
    console.error("Follow update failed:", error);
    showToast("No se pudo actualizar. " + errorText(error));
    button.disabled = false;
    button.textContent = wasFollowing ? "Siguiendo" : "Seguir";
  }
}

  const apply = (liked) => {
    button.setAttribute("aria-pressed", liked);
    counter.textContent = Math.max(0, Number(counter.textContent) + (liked ? 1 : -1));
  };
  apply(!wasLiked); // show the change immediately, undo if Supabase refuses
  button.disabled = true;
  try {
    if (wasLiked) {
      const { data, error } = await db.from("likes").delete().eq("user_id", state.me.id).eq("post_id", postId).select();
      if (error) throw error;
      if (!data.length) throw new Error("The like could not be removed.");
    } else {
      const { error } = await db.from("likes").insert({ user_id: state.me.id, post_id: postId });
      if (error && error.code !== "23505") throw error; // 23505 = already liked
    }
  } catch (error) {
    console.error(error);
    apply(wasLiked);
    showToast("Couldn't update the like. " + errorText(error));
  } finally {
    button.disabled = false;
  }
}

// Keep the 15-minute edit indicator accurate while a feed stays open.
setInterval(() => {
  document.querySelectorAll('[data-action="edit-post"]').forEach((button) => {
    const left = 15 * 60 * 1000 - (Date.now() - new Date(button.dataset.created).getTime());
    if (left <= 0) {
      const label = document.createElement("span");
      label.className = "post__edit-time";
      label.textContent = "Editing time expired";
      button.replaceWith(label);
    } else {
      button.textContent = `Edit (${Math.ceil(left / 60000)} min left)`;
    }
  });
}, 15000);

/* ---------- Router (hash based) ---------- */
function route() {
  if (!db) return renderSetupError();
  const [, page = "home", rawParam] = location.hash.split("/");
  const param = rawParam ? decodeURIComponent(rawParam) : "";
  if (page === "u") renderProfile(param);
  else if (page === "post") renderPostDetail(param);
  else if (page === "search") renderSearch();
  else if (page === "saved") renderSavedPosts();
  else if (page === "settings") renderSettings();
  else if (page === "signin" || page === "signup") renderAuth(page);
  else renderHome();

  const active = page === "u" ? (state.me && param === state.me.username ? "profile" : "") : page === "settings" || page === "saved" ? "profile" : page === "post" ? "" : page === "signin" || page === "signup" ? "" : page || "home";
  document.querySelectorAll("[data-nav]").forEach((link) => {
    const on = link.dataset.nav === active;
    link.classList.toggle("is-active", on);
    on ? link.setAttribute("aria-current", "page") : link.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
function renderSetupError() {
  view.innerHTML = `<div class="page-head"><h1>Kotoba</h1></div><div class="empty empty--error"><strong>Can't reach Supabase</strong>The Supabase library didn't load. Check your internet connection and reload the page.</div>`;
}

/* Long-press opens the same centered options sheet; click remains available for accessibility. */
let postMenuPressTimer = null;
let postMenuLongPressed = false;
document.addEventListener("pointerdown", (e) => {
  const trigger = e.target.closest(".post__menu-trigger");
  if (!trigger || e.pointerType === "mouse") return;
  postMenuLongPressed = false;
  clearTimeout(postMenuPressTimer);
  postMenuPressTimer = setTimeout(() => {
    postMenuLongPressed = true;
    openPostActions(trigger);
  }, 500);
});
["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => document.addEventListener(eventName, () => clearTimeout(postMenuPressTimer), true));

document.addEventListener("click", (e) => {
  const actionEl = e.target.closest("[data-action]");
  if (actionEl) {
    if (actionEl.dataset.action === "open-post-menu" && postMenuLongPressed) { postMenuLongPressed = false; e.preventDefault(); return; }
    const action = actionEl.dataset.action;
    const menu = actionEl.closest(".post__menu");
    if (menu) menu.open = false;
    if (action === "open-post-menu") {
      openPostActions(actionEl);
    } else if (action === "close-post-actions") {
      $("#post-actions-dialog").close();
    } else if (action === "back-post-actions") {
      const trigger = document.querySelector(`.post__menu-trigger[data-id="${CSS.escape(actionEl.closest("form")?.dataset.id || "")}"]`);
      if (trigger) openPostActions(trigger); else $("#post-actions-dialog").close();
    } else if (action === "report-content") {
      reportContent(actionEl);
    } else if (action === "delete-reply") {
      deleteReply(actionEl);
    } else if (action === "copy-content") {
      copyPost(actionEl);
      $("#post-actions-dialog").close();
    } else if (action === "like-reply") {
      toggleReplyLike(actionEl);
    } else if (action === "toggle-follow") {
      toggleFollow(actionEl);
    } else if (action === "like") {
      toggleLike(actionEl);
    } else if (action === "edit-post") {
      editPost(actionEl);
    } else if (action === "delete-post") {
      deletePost(actionEl);
    } else if (action === "save-post") {
      savePost(actionEl);
    } else if (action === "copy-post") {
      copyPost(actionEl);
    } else if (action === "open-composer") {
      if (!state.me) { showToast("Sign in to post."); location.hash = "#/signin"; return; }
      const body = $("#composer-dialog-body");
      body.innerHTML = composerHtml({ placeholder: "What's on your mind?", submitLabel: "Publish" });
      const form = $(".composer", body);
      setupComposer(form, publishPost);
      form.classList.add("is-open");
      $("#composer-dialog").showModal();
      $("textarea", form).focus();
    } else if (action === "close-dialog") {
      actionEl.closest("dialog").close();
    } else if (action === "edit-profile") {
      const form = $("#edit-form");
      form.elements.name.value = state.me.display_name || "";
      form.elements.username.value = state.me.username || "";
      form.elements.bio.value = state.me.bio || "";
      $("#edit-error").textContent = "";
      resetAvatarDraft();
      showAvatarPreview();
      $("#edit-dialog").showModal();
      form.elements.name.focus();
    } else if (action === "remove-avatar") {
      resetAvatarDraft();
      avatarDraft.remove = !!state.me.avatar_url;
      showAvatarPreview();
    } else if (action === "open-signout") {
      $("#signout-dialog").showModal();
    } else if (action === "confirm-signout") {
      actionEl.disabled = true;
      signOutUser().catch((error) => { console.error(error); showToast("Couldn't sign out. " + errorText(error)); }).finally(() => { actionEl.disabled = false; });
    } else if (action === "clear-search") {
      const box = $("#q"); box.value = ""; actionEl.hidden = true; box.focus(); doSearch("");
    } else if (action === "retry-search") {
      doSearch($("#q").value);
    } else if (action === "reload-view") {
      route();
    }
    return;
  }
  // Clicking anywhere on a feed post opens it (links and buttons keep their own behaviour).
  const post = e.target.closest(".post--link");
  if (post && !e.target.closest("a, button")) location.hash = `#/post/${post.dataset.postId}`;
});

document.addEventListener("submit", async (e) => {
  if (e.target.id === "settings-email-form" || e.target.id === "settings-password-form") {
    e.preventDefault();
    const form = e.target;
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
      if (form.id === "settings-email-form") {
        const email = $("#settings-email").value.trim();
        const { error } = await db.auth.updateUser({ email });
        if (error) throw error;
        showToast("Solicitud enviada. Revisa tu correo para confirmar el cambio.");
      } else {
        const password = $("#settings-password").value;
        const { error } = await db.auth.updateUser({ password });
        if (error) throw error;
        form.reset();
        showToast("Contraseña actualizada.");
      }
    } catch (error) { showToast(errorText(error)); }
    finally { button.disabled = false; }
    return;
  }
  if (e.target.id !== "report-form") return;
  e.preventDefault();
  const form = e.target;
  const reason = $("#report-reason").value;
  const details = $("#report-details").value.trim();
  if (!reason) { $("#report-error").textContent = "Elegí un motivo."; return; }
  if (state.me && form.dataset.authorId && form.dataset.authorId === state.me.id) { $("#report-error").textContent = "No puedes reportar tu propio contenido."; return; }
  const submit = $("button[type=submit]", form);
  submit.disabled = true;
  try {
    await run(db.rpc("report_kotoba_content", {
      p_target_type: form.dataset.kind,
      p_target_id: form.dataset.id,
      p_reason: reason,
      p_details: details || null
    }));
    $("#post-actions-dialog").close();
    showToast("Reporte enviado. Gracias por avisarnos.");
  } catch (error) {
    $("#report-error").textContent = "No se pudo enviar el reporte: " + errorText(error);
    submit.disabled = false;
  }
});

/* A new photo is chosen: crop, compress and show a preview. Nothing is uploaded until "Save changes". */
document.addEventListener("change", async (e) => {
  if (e.target.id !== "ed-avatar") return;
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const error = $("#edit-error");
  error.textContent = "";
  try {
    const blob = await prepareAvatar(file);
    resetAvatarDraft();
    avatarDraft.blob = blob;
    avatarDraft.previewUrl = URL.createObjectURL(blob);
    showAvatarPreview();
  } catch (err) {
    error.textContent = errorText(err);
  }
});

/* Edit profile: photo, display name, username and bio. Only the signed-in user's own row is touched
   (id = state.me.id) and the database policies (RLS) enforce the same rule on the server. */
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "edit-form") return;
  e.preventDefault();
  const form = e.target;
  const error = $("#edit-error");
  error.textContent = "";
  const me = state.me;
  const oldUsername = me.username || "";
  const oldAvatarUrl = me.avatar_url;
  const name = form.elements.name.value.trim();
  const username = form.elements.username.value.trim().toLowerCase();
  if (!name) { error.textContent = "Enter a display name."; form.elements.name.focus(); return; }
  const usernameCheck = authFields.username.check(username);
  if (usernameCheck !== true) { error.textContent = usernameCheck; form.elements.username.focus(); return; }

  const save = $("button[type=submit]", form);
  save.disabled = true;
  let uploaded = null;
  let saved = false;
  try {
    const changes = { display_name: name, bio: form.elements.bio.value.trim() };
    if (username !== oldUsername.toLowerCase()) {
      const { data: taken } = await run(db.from("profiles").select("id").eq("username", username).neq("id", me.id).maybeSingle());
      if (taken) throw new Error("That username is already taken.");
      changes.username = username;
    }
    if (avatarDraft.blob) { uploaded = await uploadAvatar(avatarDraft.blob); changes.avatar_url = uploaded.url; }
    else if (avatarDraft.remove) changes.avatar_url = null;

    let data;
    try {
      ({ data } = await run(db.from("profiles").update(changes).eq("id", me.id).select(PROFILE_COLUMNS).maybeSingle()));
    } catch (err) {
      if (err.code === "23505") throw new Error("That username is already taken.");
      throw err;
    }
    if (!data) throw new Error("The profile was not updated (check the RLS update policy).");
    saved = true;

    if ("avatar_url" in changes) {
      const oldPath = avatarPathFromUrl(oldAvatarUrl);
      if (oldPath && oldPath.startsWith(me.id + "/")) await removeAvatarFile(oldPath); // clean up the previous photo
    }
    state.me = data;
    resetAvatarDraft();
    $("#edit-dialog").close();
    updateChrome();
    // If we are on the old profile link, move to the new one; otherwise just refresh the page.
    if (data.username !== oldUsername && location.hash === `#/u/${encodeURIComponent(oldUsername)}`) location.hash = profileHref(data);
    else route();
    showToast("Profile saved");
  } catch (err) {
    console.error(err);
    error.textContent = errorText(err);
    if (uploaded && !saved) removeAvatarFile(uploaded.path); // don't leave an orphan file behind
  } finally {
    save.disabled = false;
  }
});

/* ---------- Start ---------- */
async function init() {
  window.addEventListener("hashchange", route);
  if (!db) { renderSetupError(); return; }
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    await handleSession(data.session);
  } catch (error) {
    console.error("Could not read the session:", error);
    updateChrome();
  }
  db.auth.onAuthStateChange((event, session) => {
    // Run outside the callback so supabase-js can finish its own work first.
    setTimeout(async () => {
      if (event === "SIGNED_OUT") { await handleSession(null); route(); }
      else if ((event === "SIGNED_IN" || event === "USER_UPDATED") && session && state.me?.id !== session.user.id) { await handleSession(session); route(); }
    }, 0);
  });
  route();
}
init();

</script>
